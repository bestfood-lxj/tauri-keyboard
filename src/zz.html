<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<script>
		window.min=function(ev){
			console.log(ev)
		}
	</script>
	<input type="text" id="inp">
	<div id="box"></div>
	<script>
window.onload = function(){
	var inp = document.querySelector("#inp");
	var box = document.querySelector("#box");
	inp.onkeydown=function(ev){
		let res = {
			keyCode:ev.keyCode,
			key:ev.key,
			code:ev.code,
			type:ev.type,
		}
		console.log(ev,JSON.stringify(res))
		box.innerText = JSON.stringify(res)
	}

}

	</script>
</body>
</html>
